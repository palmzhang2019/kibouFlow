<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- Brand accent bar -->
  <rect x="120" y="160" width="10" height="100" rx="5" fill="#0e7490"/>
  <!-- Brand name -->
  <text x="150" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="#0e7490" letter-spacing="4">kibouFlow</text>
  <!-- Main message line 1 -->
  <text x="120" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#0f172a">在日本发展，先把方向整理清楚</text>
  <!-- Main message line 2 -->
  <text x="120" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#334155">先理清现状，再选择下一步</text>
  <!-- Decorative path graphic -->
  <g transform="translate(600, 780)">
    <path d="M-180,-200 Q0,-100 180,0" stroke="#0e7490" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M0,-220 L0,0" stroke="#0e7490" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M180,-200 Q0,-100 -180,0" stroke="#0e7490" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="32" fill="#0e7490"/>
    <circle cx="0" cy="0" r="16" fill="#f8fafc"/>
  </g>
  <!-- Bottom tagline -->
  <text x="120" y="1080" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#64748b">先整理希望，再判断路径，再导向下一步</text>
</svg>
